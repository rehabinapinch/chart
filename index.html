<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Note Templates</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f9ff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 2rem 1.5rem;
            color: #1e2a3a;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #1e3a6f;
            border-bottom: 3px solid #b6d0f0;
            padding-bottom: 0.3rem;
            margin-bottom: 1.2rem;
        }
        .sub {
            color: #3a5a7a;
            font-size: 0.95rem;
            margin-top: -0.5rem;
            margin-bottom: 2rem;
            display: block;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
            margin: 1.8rem 0 2.5rem;
        }
        .preset-btn {
            background: white;
            border: 1px solid #d6e4f5;
            border-radius: 14px;
            padding: 1rem 0.5rem;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            color: #1e3a6f;
            box-shadow: 0 3px 8px rgba(0,20,50,0.04);
            cursor: pointer;
            transition: 0.18s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }
        .preset-btn:hover {
            background: #e8f0fe;
            border-color: #7a9fd8;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(30,58,111,0.08);
        }
        .preset-btn small {
            font-weight: 400;
            color: #5b7a9a;
            font-size: 0.75rem;
        }
        .note-area {
            background: white;
            border-radius: 18px;
            padding: 1.8rem;
            box-shadow: 0 8px 28px rgba(0,0,0,0.03);
            border: 1px solid #e6edf8;
        }
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }
        .note-header h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #1e3a6f;
        }
        .actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .actions button {
            background: #f0f6ff;
            border: 1px solid #c7daf5;
            border-radius: 40px;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e3a6f;
            cursor: pointer;
            transition: 0.15s;
        }
        .actions button:hover {
            background: #dce8fd;
            border-color: #7a9fd8;
        }
        .copy-btn {
            background: #1e3a6f;
            color: white;
            border: none;
            padding: 0.45rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .copy-btn:hover {
            background: #14305a;
        }
        textarea {
            width: 100%;
            min-height: 480px;
            border: 1px solid #dce6f0;
            border-radius: 16px;
            padding: 1.2rem;
            font-family: 'Menlo', 'Consolas', monospace;
            font-size: 0.9rem;
            line-height: 1.65;
            color: #1a2a44;
            resize: vertical;
            background: #fbfdff;
            transition: 0.15s;
        }
        textarea:focus {
            border-color: #4a7fc7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(74,127,199,0.15);
        }
        .footer-note {
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: #5b7a9a;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }
        .footer-note a {
            color: #1e3a6f;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid transparent;
            transition: 0.15s;
        }
        .footer-note a:hover {
            border-bottom-color: #1e3a6f;
        }
        .badge {
            background: #eaf1fc;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #1e3a6f;
            font-weight: 500;
        }
        .empty-state {
            color: #7a94b0;
            font-style: italic;
            padding: 1rem 0 0.5rem;
            border-top: 1px dashed #d6e4f5;
            margin-top: 0.5rem;
        }
        @media (max-width: 600px) {
            body { padding: 1rem; }
            .grid { grid-template-columns: repeat(2, 1fr); }
            .note-header { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 Assessment Note Templates</h1>
    <span class="sub">Click a template to insert structured
